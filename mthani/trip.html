<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="mthani-64.png">
<link rel="apple-touch-icon" href="mthani-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>موافقة ولي الأمر على الرحلة — منصة مثاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#3B5F78; --navy3:#1F3546; --gold:#D08E2C; --gold2:#B87A1F; --light:#EAF0F4; --goldlight:#FBF1E1;
    --bg:#F5F3EE; --card:#FFFFFF; --text:#1E2A33; --muted:#66727C; --red:#B3261E; --line:#E2DDD3; --ok:#1B6B40; --okbg:#E3F2EA; --errbg:#FCE8E6; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0F161C; --card:#18222B; --text:#E9EEF2; --muted:#9DABB6; --light:#1F2D38; --goldlight:#2E2618; --line:#2A3743;
    --ok:#8FD9AE; --okbg:#183326; --errbg:#3A1F1D; --red:#F2B8B5; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
  .hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;padding:24px 16px 46px;text-align:center;border-bottom:4px solid var(--gold)}
  .hero .logo{width:84px;height:84px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--gold);overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .hero .logo img{width:72px;height:72px;object-fit:contain}
  .hero h1{margin:8px 0 0;font-size:22px} .hero h1 span{color:#F3D9AE}
  .hero p{margin:6px 0 0;font-size:14px;color:#F3D9AE}
  .notice{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--errbg);color:var(--red);font-size:14px;font-weight:700;line-height:1.8;border:1px solid rgba(179,38,30,.25)}
  .bw.choose{grid-template-columns:1fr}
  .seg{display:inline-flex;background:var(--light);border-radius:10px;padding:3px;margin-bottom:6px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:6px 16px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--navy);color:#fff}
  .hero .org{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:12px;opacity:.92}
  .hero .org img{width:26px;height:26px;border-radius:50%;background:#fff;padding:2px}
  main{max-width:560px;margin:-28px auto 0;padding:0 16px 40px}
  .card{background:var(--card);border-radius:18px;padding:18px 16px;box-shadow:0 6px 22px rgba(20,40,60,.08);border:1px solid var(--line);margin-bottom:12px}
  h2{margin:0 0 4px;color:var(--navy);font-size:19px} @media (prefers-color-scheme: dark){ h2{color:#E8B867} }
  small,.muted{color:var(--muted)}
  label{display:block;font-size:14px;margin:10px 0 4px;color:var(--muted)}
  input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .edgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px} .edgrid .full{grid-column:1/-1}
  .bw{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;align-items:end}
  .bw small{display:block;font-size:12px;margin-bottom:2px}
  .bw .hs{display:grid;grid-template-columns:.8fr 1.6fr 1fr;gap:4px} .bw .hs select{padding:10px 4px;font-size:14px}
  @media (max-width:430px){ .bw{grid-template-columns:1fr} }
  .btn{display:block;width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.6}
  .btn.light{background:var(--light);color:var(--text)}
  .msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.7}
  .msg.err{background:var(--errbg);color:var(--red)} .msg.info{background:var(--light)} .msg.ok{background:var(--okbg);color:var(--ok)}
  .done{text-align:center}
  .wait{font-size:56px;font-weight:700;color:var(--gold2);line-height:1.1;margin:8px 0}
  .hp{position:absolute;top:0;right:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
  .hidden{display:none!important}

  .dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:10px 0 0;font-size:15px;line-height:1.7} .dl dt{color:var(--muted);white-space:nowrap} .dl dd{margin:0;font-weight:600} .mapb{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--light);color:var(--navy);text-decoration:none;font-weight:700}
  .who{display:flex;align-items:center;gap:10px;background:var(--goldlight);border-radius:14px;padding:12px 14px;margin-top:4px} .who b{font-size:17px} .who small{display:block}
  .pledge{background:var(--light);border-radius:12px;padding:12px 14px;line-height:1.9;font-weight:700;margin:8px 0 2px;border-inline-start:4px solid var(--gold)}
  textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);min-height:84px;resize:vertical} textarea:focus{outline:none;border-color:var(--gold)}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px} .choice button{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .choice button.on.yes{background:var(--ok);border-color:var(--ok);color:#fff} .choice button.on.no{background:var(--red);border-color:var(--red);color:#fff}
  .stt{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;background:var(--light)} .stt.yes{background:var(--okbg);color:var(--ok)} .stt.no{background:var(--errbg);color:var(--red)} .stt.wait{background:var(--goldlight);color:var(--gold2)}
  .req{color:var(--red)}
</style>
</head>
<body>
<div class="hero">
  <div class="logo"><img id="orgLogo" src="mthani-192.png" alt="شعار المجمع"></div>
  <h1>موافقة ولي الأمر على الرحلة</h1>
  <p id="orgName">منصة مثاني</p>
</div>
<main>
  <div class="card" id="load"><div class="msg info">جاري تحميل بيانات الرحلة...</div></div>
  <div class="card hidden" id="err"><h2>تعذّر فتح الرابط</h2><div class="msg err" id="errMsg"></div></div>
  <div class="hidden" id="page">
    <div class="card">
      <h2 id="tTitle"></h2>
      <div class="who"><div><b id="sName"></b><small id="hName"></small></div></div>
      <dl class="dl" id="tInfo"></dl>
    </div>
    <div class="card hidden" id="prev"><div class="msg" id="prevMsg"></div><button class="btn light" id="chg" type="button">تعديل الرد</button></div>
    <div class="card hidden" id="closed"><div class="msg info" id="closedMsg"></div></div>
    <form class="card hidden" id="form" novalidate>
      <h2>ردّكم على مشاركة ابنكم</h2>
      <div class="choice"><button type="button" class="yes" id="bYes">أوافق</button><button type="button" class="no" id="bNo">لا أوافق</button></div>
      <div id="fields" class="hidden">
        <label for="pname">اسم ولي الأمر <span class="req">*</span></label><input id="pname" autocomplete="name" maxlength="60">
        <label for="pnid">رقم هوية ولي الأمر <span class="req">*</span></label><input id="pnid" inputmode="numeric" maxlength="10" dir="ltr" style="text-align:right" placeholder="10 أرقام">
        <div id="yesF">
          <label for="emerg">جوال الطوارئ يوم الرحلة <span class="req">*</span></label><input id="emerg" type="tel" inputmode="tel" maxlength="10" dir="ltr" style="text-align:right" placeholder="05xxxxxxxx">
          <label for="health">ملاحظات صحية (حساسية، أدوية...) — اختياري</label><textarea id="health" maxlength="300"></textarea>
          <label>نص التعهد</label><div class="pledge" id="pledgeTxt"></div>
          <label for="pledge">أعد كتابة نص التعهد أعلاه <span class="req">*</span></label><textarea id="pledge" maxlength="500" autocomplete="off"></textarea>
        </div>
        <button class="btn" id="send" type="submit">إرسال الرد</button>
      </div>
      <div id="fMsg" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx1n59uCh_fri9XsUyxZlB7bXst4Ay-gZzKn8hIiQjunFotQQsEfE_8eQbhNmshHcI/exec';
const $ = id => document.getElementById(id);
(async () => { let B = {}; try { B = JSON.parse(localStorage.getItem('hq_brand') || '{}') || {}; } catch(e){}
  const put = b => { const i = $('orgLogo'), n = $('orgName'); if (i) i.src = b.logo || 'mthani-192.png'; if (n && (b.org || b.orgShort)) n.textContent = b.org || b.orgShort; if (b.orgShort || b.org) document.title = 'موافقة ولي الأمر على الرحلة — ' + (b.orgShort || b.org); };
  put(B); try { const r = await (await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'brand' }) })).json(); if (r && r.ok){ B = { org:r.org, orgShort:r.orgShort, logo:r.logo }; try { localStorage.setItem('hq_brand', JSON.stringify(B)); } catch(e){} put(B); } } catch(e){} })();
async function post(data){ const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(data) }); return r.json(); }
const T = new URLSearchParams(location.search).get('t') || '';
let ANS = '', R = null;
const fm = (t, c) => { const b = $('fMsg'); b.className = t ? 'msg ' + c : ''; b.textContent = t || ''; };
const STT = { 'موافق':['yes', 'وافقتم على مشاركة ابنكم ✓'], 'رافض':['no', 'اعتذرتم عن مشاركة ابنكم'], 'انتظار':['wait', 'وافقتم، وابنكم في قائمة الانتظار لاكتمال المقاعد'] };
function pick(a){ ANS = a; $('bYes').classList.toggle('on', a === 'yes'); $('bNo').classList.toggle('on', a === 'no'); $('fields').classList.remove('hidden'); $('yesF').classList.toggle('hidden', a !== 'yes'); fm('', ''); }
$('bYes').onclick = () => pick('yes'); $('bNo').onclick = () => pick('no');
$('chg').onclick = () => { $('prev').classList.add('hidden'); $('form').classList.remove('hidden'); };
$('pledge').addEventListener('paste', e => { e.preventDefault(); fm('اكتب نص التعهد بنفسك، ولا تلصقه.', 'err'); });
function show(r){
  R = r; $('load').classList.add('hidden'); $('page').classList.remove('hidden');
  const t = r.trip; $('tTitle').textContent = /^رحل(ة|ه)\s/.test(t.title) ? t.title : 'رحلة ' + t.title; $('sName').textContent = r.sname; $('hName').textContent = r.hname || '';
  const dl = $('tInfo'); dl.innerHTML = ''; [['اليوم', t.day], ['المكان', t.place], ['الانطلاق', [t.go && 'الساعة ' + t.go, t.meet && 'من ' + t.meet].filter(Boolean).join(' ')], ['العودة', t.back && 'الساعة ' + t.back],
    ['ما يحضره الطالب', t.bring], ['المشرفون', t.sups], ['جوال المشرف', t.supPhone], ['معلم الحلقة', [t.tname, t.tphone].filter(Boolean).join(' — ')], ['الرسوم', t.fee], ['ملاحظات', t.notes], ['آخر موعد للرد', t.deadline]].forEach(x => { if (!x[1]) return; const a = document.createElement('dt'), b = document.createElement('dd'); a.textContent = x[0]; b.textContent = x[1]; dl.appendChild(a); dl.appendChild(b); });
  if (/^https:\/\//.test(t.meetLoc || '')){ const a = document.createElement('dt'), b = document.createElement('dd'), l = document.createElement('a'); a.textContent = 'موقع التجمع';
    l.href = t.meetLoc; l.target = '_blank'; l.rel = 'noopener'; l.className = 'mapb'; l.textContent = '📍 فتح الموقع في الخرائط'; b.appendChild(l); dl.appendChild(a); dl.appendChild(b); }
  $('pledgeTxt').textContent = t.pledge;
  const st = STT[r.status];
  if (st){ $('prev').classList.remove('hidden'); $('prevMsg').className = 'msg ' + (st[0] === 'no' ? 'err' : st[0] === 'wait' ? 'info' : 'ok'); $('prevMsg').textContent = st[1] + (r.pname ? ' — ' + r.pname : '') + (r.at ? ' (' + r.at.slice(0, 16) + ')' : ''); }
  if (r.closed){ $('closed').classList.remove('hidden'); $('closedMsg').textContent = r.closed; $('chg').classList.add('hidden'); $('form').classList.add('hidden'); return; }
  if (!st) $('form').classList.remove('hidden');
  if (r.pname) $('pname').value = r.pname;
}
$('form').addEventListener('submit', async e => {
  e.preventDefault(); if (!ANS) return fm('اختر: أوافق أو لا أوافق.', 'err');
  const d = { action:'tripAnswer', t:T, ans:ANS, pname:$('pname').value.trim(), pnid:$('pnid').value.trim(), emerg:$('emerg').value.trim(), health:$('health').value.trim(), pledge:$('pledge').value.trim() };
  if (d.pname.split(/\s+/).filter(Boolean).length < 2) return fm('اكتب اسم ولي الأمر (الاسم الأول واسم العائلة على الأقل).', 'err');
  if (!/^[12]\d{9}$/.test(d.pnid.replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x)))) return fm('اكتب رقم هوية ولي الأمر (10 أرقام).', 'err');
  if (ANS === 'yes' && !/^05\d{8}$/.test(d.emerg.replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x)))) return fm('اكتب جوال الطوارئ (05xxxxxxxx).', 'err');
  if (ANS === 'yes' && d.pledge.length < 10) return fm('أعد كتابة نص التعهد في الخانة المخصصة.', 'err');
  const b = $('send'); b.disabled = true; fm('جاري الإرسال...', 'info');
  try { const r = await post(d); if (!r.ok){ fm(r.msg, 'err'); b.disabled = false; return; }
    $('form').classList.add('hidden'); $('prev').classList.remove('hidden'); $('prevMsg').className = 'msg ' + (r.status === 'رافض' ? 'err' : r.status === 'انتظار' ? 'info' : 'ok'); $('prevMsg').textContent = r.msg; $('chg').classList.remove('hidden'); }
  catch(err){ fm('تعذّر الإرسال، تحقق من الإنترنت وحاول مجدداً.', 'err'); }
  b.disabled = false;
});
(async () => { if (!T){ $('load').classList.add('hidden'); $('err').classList.remove('hidden'); $('errMsg').textContent = 'الرابط ناقص. افتحه كاملاً من رسالة المجمع.'; return; }
  try { const r = await post({ action:'tripOpen', t:T }); if (!r.ok) throw new Error(r.msg); show(r); }
  catch(e){ $('load').classList.add('hidden'); $('err').classList.remove('hidden'); $('errMsg').textContent = e.message && !/fetch|network/i.test(e.message) ? e.message : 'تعذّر الاتصال، حاول مجدداً.'; } })();
</script>
</body>
</html>
