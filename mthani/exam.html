<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="mthani-64.png">
<title>مثاني - اختبار المرحليات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#3B5F78; --navy3:#1F3546; --gold:#D08E2C; --light:#EAF0F4; --goldlight:#FBF1E1;
    --bg:#F5F3EE; --card:#FFFFFF; --text:#1E2A33; --muted:#66727C; --red:#B3261E; --line:#E2DDD3; --ok:#1B6B40; --okbg:#E3F2EA; --errbg:#FCE8E6;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0F161C; --card:#18222B; --text:#E9EEF2; --muted:#9DABB6; --light:#1F2D38; --goldlight:#2E2618; --line:#2A3743; --ok:#8FD9AE; --okbg:#183326; --errbg:#3A1F1D; --red:#F2B8B5; }
  }
  :root[data-theme="dark"]{ --bg:#0F161C; --card:#18222B; --text:#E9EEF2; --muted:#9DABB6; --light:#1F2D38; --goldlight:#2E2618; --line:#2A3743; --ok:#8FD9AE; --okbg:#183326; --errbg:#3A1F1D; --red:#F2B8B5; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
  .hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;padding:22px 16px 46px;text-align:center;border-bottom:4px solid var(--gold)}
  .hero img{width:64px;height:64px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3))}
  .hero h1{margin:8px 0 0;font-size:21px} .hero p{margin:6px 0 0;font-size:13px;color:#F3D9AE}
  main{max-width:760px;margin:-28px auto 0;padding:0 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  h2{margin:0 0 8px;font-size:18px;color:var(--navy)} @media (prefers-color-scheme: dark){ h2{color:#C9DCEA} }
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  textarea{min-height:70px}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--light);color:var(--navy)}
  button.main{background:var(--navy);color:#fff;width:100%;margin-top:12px;font-size:16px}
  button.gold{background:var(--gold);color:#fff}
  button:disabled{opacity:.6}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .kv div{background:var(--bg);border-radius:12px;padding:10px} .kv small{display:block;color:var(--muted);font-size:12px} .kv b{font-size:15px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
  .chips button{padding:7px 12px;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .st{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
  .st .nm{flex:1 1 220px} .st .nm b{display:block;font-size:16px} .st .nm small{color:var(--muted)}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--light);color:var(--navy)}
  .p-lv{background:var(--goldlight);color:var(--gold)} .p-ok{background:var(--okbg);color:var(--ok)} .p-no{background:var(--errbg);color:var(--red)}
  .msg{padding:10px 12px;border-radius:12px;margin-top:10px;font-size:14px} .msg.err{background:var(--errbg);color:var(--red)} .msg.ok{background:var(--okbg);color:var(--ok)} .msg.info{background:var(--light);color:var(--navy)}
  .hidden{display:none!important}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px 0}
  .sheet .card{width:min(760px,100%);margin:0 8px}
  @media (min-width:900px){ .sheet{align-items:center;padding:12px 0} .sheet .card{width:min(1280px,96vw);max-height:96vh;overflow:auto} .sheet .grid2{grid-template-columns:repeat(4,1fr)} }
  .mushaf{position:sticky;right:0;max-width:calc(100vw - 48px);font-family:'Amiri Quran','Amiri','Traditional Arabic',serif;font-size:22px;line-height:2.1;text-align:right;padding:10px 14px;margin:4px 0 10px;border-radius:14px;background:#FFFCF5;color:#2B2112;border:1px solid #E7D6B0;box-shadow:inset 0 0 0 4px #FFFCF5,inset 0 0 0 5px #E7D6B0}
  .mushaf .sh{display:block;text-align:center;font-family:Tajawal,sans-serif;font-weight:700;font-size:15px;color:#7A5A1E;background:#F6EAD0;border-radius:10px;padding:3px 0;margin:8px 0 4px;line-height:1.6}
  .mushaf .bs{display:block;text-align:center;margin-bottom:4px} .mushaf .an{color:#9A6B16;white-space:nowrap}
  .mushaf .more{display:block;margin:6px auto 0;font-family:Tajawal,sans-serif;font-size:13px;padding:4px 14px;border-radius:999px;background:#F6EAD0;color:#7A5A1E}
  @media (prefers-color-scheme: dark){ .mushaf{background:#1F1A10;color:#F2E9D8;border-color:#5A4826;box-shadow:inset 0 0 0 4px #1F1A10,inset 0 0 0 5px #5A4826} .mushaf .sh,.mushaf .more{background:#3A2E18;color:#E8C98A} }
  .mfb{padding:6px 10px;font-size:12.5px;border-radius:999px;white-space:nowrap}
  tr.mfr td{border-top:0!important}
  .shd{display:flex;justify-content:space-between;align-items:center;gap:8px} .shd button{padding:6px 12px;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .tw{overflow-x:auto;margin-top:10px}
  table.q{width:100%;border-collapse:collapse;font-size:14px} table.q th{font-size:12px;color:var(--muted);font-weight:500;padding:6px 4px;text-align:right}
  table.q td{padding:4px;border-top:1px solid var(--line)} table.q input,table.q select{padding:7px 8px;font-size:15px}
  table.q input[type=number]{width:62px} table.q select{min-width:130px}
  .tot{display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:700}
  .tot.ok{background:var(--okbg);color:var(--ok)} .tot.no{background:var(--errbg);color:var(--red)} .tot b{font-size:22px}
  small.note{display:block;color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.7}
  .stepper{display:inline-flex;align-items:center;gap:4px} .stepper input{width:58px!important;text-align:center;padding:7px 4px!important;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper button{width:34px;height:34px;padding:0;border-radius:10px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
  .perf{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
  input[readonly]{background:var(--light);font-weight:700}
  .bar{height:8px;background:var(--light);border-radius:8px;overflow:hidden;margin-top:10px} .bar i{display:block;height:100%;background:var(--ok)}
  #print{display:none}
  @media print{
    body{background:#fff;color:#000} .hero,main,.sheet{display:none!important} #print{display:block;padding:10mm;font-size:12pt}
    #print h1{font-size:16pt;margin:0} #print table{width:100%;border-collapse:collapse;margin-top:10px} #print th,#print td{border:1px solid #999;padding:5px 6px;text-align:right}
    #print th{background:#eee} #print .ph{display:flex;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:6px} #print .sig{margin-top:30px;display:flex;justify-content:space-between}
  }
</style>
</head>
<body>
<div class="hero"><img src="mthani-192.png" alt="مثاني"><h1>اختبار المرحليات</h1><p id="hOrg">مجمع حلقات ربيع القلوب القرآني بجامع علي الشبلان - أبها</p></div>
<main>
  <div class="card" id="cLogin">
    <h2>دخول مشرف الجمعية</h2>
    <small class="note">ادخل برقم هويتك المسجل لدى المجمع، فتظهر لك المجموعات المرسلة إليك.</small>
    <label for="nid">رقم الهوية</label>
    <input id="nid" inputmode="numeric" maxlength="10" autocomplete="username" placeholder="1xxxxxxxxx" dir="ltr" style="text-align:center;letter-spacing:2px;font-size:20px">
    <button class="main" id="go">دخول</button>
    <div id="lMsg"></div>
  </div>
  <div id="home" class="hidden">
    <div class="card">
      <div class="shd"><h2 id="hName" style="margin:0">المختبرون</h2><button id="out">خروج</button></div>
      <small class="note" id="hSub"></small>
      <div id="bList"></div>
    </div>
  </div>
  <div id="app" class="hidden">
    <div class="card">
      <div class="shd"><h2 id="bTitle" style="margin:0">مجموعة الاختبار</h2><button id="back">→ المختبرون</button></div>
      <div class="kv" id="bKv"></div>
      <div class="bar"><i id="bBar" style="width:0"></i></div>
      <div class="row"><button class="main hidden" id="fin" style="margin-top:0">✓ اعتماد النتائج</button></div>
      <div class="row"><button class="gold" id="rPrint">طباعة تقرير النتائج / PDF</button><button id="rXls">تنزيل Excel</button></div>
      <div id="bMsg"></div>
    </div>
    <div class="card">
      <div class="chips" id="flt"></div>
      <input id="q" placeholder="ابحث باسم الطالب أو الهوية" style="margin-top:10px">
      <div id="list"></div>
    </div>
  </div>
</main>
<div class="sheet hidden" id="sh"><div class="card">
  <div class="shd"><h2 id="shT" style="margin:0">اختبار الطالب</h2><button id="shX" aria-label="إغلاق" style="width:40px;height:40px;border-radius:50%;padding:0;font-size:18px">✕</button></div>
  <div id="shB"></div>
</div></div>
<div id="print"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx1n59uCh_fri9XsUyxZlB7bXst4Ay-gZzKn8hIiQjunFotQQsEfE_8eQbhNmshHcI/exec';
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const SKEY = 'ex_login';
const ss = { get(){ try { return JSON.parse(sessionStorage.getItem(SKEY) || 'null'); } catch(e){ return null; } }, set(v){ try { sessionStorage.setItem(SKEY, JSON.stringify(v)); } catch(e){} }, del(){ try { sessionStorage.removeItem(SKEY); } catch(e){} } };
const W = { h:1, t:0.5, j:0.5 };
const MR_RANGE = { 'الأولى':[114,67], 'الثانية':[66,52], 'الثالثة':[51,42], 'الرابعة':[41,36], 'الخامسة':[35,29], 'السادسة':[28,24], 'السابعة':[23,19], 'الثامنة':[18,15],
  'التاسعة':[14,11], 'العاشرة':[10,8], 'الحادية عشرة':[7,7], 'الثانية عشرة':[6,5], 'الثالثة عشرة':[4,4], 'الرابعة عشرة':[3,3], 'الخامسة عشرة':[2,2] };
const mrRange = lv => MR_RANGE[String(lv || '').replace(/^المرحلية\s*/, '').trim()] || null;
const msg = (id, t, c) => { const b = $(id); b.innerHTML = ''; if (t) b.appendChild(el('div', 'msg ' + (c || 'info'), t)); };
const dayName = d => { try { return new Date(d + 'T12:00:00').toLocaleDateString('ar-SA', { weekday:'long' }); } catch(e){ return ''; } };
const ordAr = n => { const u = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة', 'العاشرة'], h = ['الحادية', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة'],
  t = ['', '', 'العشرون', 'الثلاثون', 'الأربعون', 'الخمسون', 'الستون', 'السبعون', 'الثمانون', 'التسعون']; n = +n || 0;
  if (n < 1 || n > 99) return 'رقم ' + n; if (n <= 10) return u[n - 1]; if (n < 20) return h[n - 11] + ' عشرة'; return n % 10 ? h[n % 10 - 1] + ' و' + t[Math.floor(n / 10)] : t[n / 10]; };
const bName = no => 'المجموعة رقم ' + no;
const toAr = s => String(s || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
let X = null, H = null, NID = '', BID = '', F = 'all';

async function call(data){
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ nid:NID }, BID ? { bid:BID } : {}, data)) });
  return r.json();
}
const show = id => ['cLogin', 'home', 'app'].forEach(k => $(k).classList.toggle('hidden', k !== id));
async function open1(nid, silent){
  NID = toAr(nid).replace(/\D/g, ''); BID = '';
  if (NID.length !== 10){ if (!silent) msg('lMsg', 'رقم الهوية 10 أرقام.', 'err'); return; }
  $('go').disabled = true; if (!silent) msg('lMsg', 'جاري التحقق...', 'info');
  try { const r = await call({ action:'exOpen' });
    if (!r.ok){ ss.del(); msg('lMsg', r.msg || 'تعذّر الدخول.', 'err'); return; }
    ss.set({ n:NID }); H = r; msg('lMsg', '', ''); renderHome();
    const g = +new URLSearchParams(location.search).get('g'); if (g && !window._gDone){ window._gDone = 1; const b = H.batches.find(x => x.no === g); if (b) openB(b.id); }
  } catch(e){ msg('lMsg', 'تعذّر الاتصال. تأكد من الإنترنت وحاول مجدداً.', 'err'); }
  finally { $('go').disabled = false; }
}
function renderHome(){
  if (H.org) $('hOrg').textContent = H.org; show('home');
  $('hName').textContent = 'مرحباً ' + H.sup; $('hSub').textContent = (H.supOrg ? H.supOrg + ' • ' : '') + 'المجموعات المرسلة إليك: ' + H.batches.length + '. المجموعة التي تعتمد نتائجها تبقى مرجعاً للاطلاع فقط.';
  const box = $('bList'); box.innerHTML = '';
  H.batches.forEach(b => { const w = el('div', 'st'), nm = el('div', 'nm'); nm.appendChild(el('b', '', bName(b.no))); nm.appendChild(el('small', '', dayName(b.date) + ' ' + b.date + ' • ' + b.n + ' طالب')); w.appendChild(nm);
    const fin = !!b.final; w.appendChild(el('span', 'pill ' + (fin ? 'p-ok' : b.back ? 'p-no' : b.rec ? 'p-lv' : ''), fin ? 'معتمدة ✓' : b.back ? 'أُعيدت إليك للمراجعة' : b.rec ? 'سُجّل ' + b.rec + ' من ' + b.n : 'لم تبدأ'));
    if (fin) w.appendChild(el('span', 'pill p-ok', 'اجتاز ' + b.ok + ' من ' + b.n));
    const o = el('button', fin ? '' : 'gold', fin ? 'عرض التقرير' : 'فتح المجموعة'); o.onclick = () => openB(b.id); w.appendChild(o); box.appendChild(w); });
}
async function openB(id){ BID = id; try { const r = await call({ action:'exOpen' }); if (!r.ok){ BID = ''; return alert(r.msg); } X = r; F = 'all'; $('q').value = ''; show('app'); msg('bMsg', '', ''); render(); window.scrollTo(0, 0); } catch(e){ BID = ''; alert('تعذّر الاتصال.'); } }
$('back').onclick = async () => { BID = ''; try { const r = await call({ action:'exOpen' }); if (r.ok) H = r; } catch(e){} renderHome(); };
$('go').onclick = () => open1($('nid').value);
$('nid').onkeydown = e => { if (e.key === 'Enter') open1($('nid').value); };
$('out').onclick = () => { ss.del(); location.reload(); };
$('fin').onclick = async () => { if (!confirm('اعتماد نتائج ' + bName(X.no) + '؟ بعد الاعتماد تُغلق المجموعة ولا يمكن تعديل أي نتيجة، وتبقى لك مرجعاً للاطلاع.')) return;
  $('fin').disabled = true; try { const r = await call({ action:'exSave', final:1 }); if (!r.ok) return msg('bMsg', r.msg, 'err'); X = r; render(); msg('bMsg', r.msg, 'ok'); }
  catch(e){ msg('bMsg', 'تعذّر الاتصال، حاول مجدداً.', 'err'); } finally { $('fin').disabled = false; } };
const done = s => s.status === X.st.ok || s.status === X.st.no;
function render(){
  if (X.org) $('hOrg').textContent = X.org;
  $('bTitle').textContent = bName(X.no) + ' — ' + dayName(X.date) + ' ' + X.date;
  const n = X.list.length, d = X.list.filter(done).length, ok = X.list.filter(s => s.status === X.st.ok).length;
  const kv = $('bKv'); kv.innerHTML = ''; [['المختبِر', X.sup + (X.supOrg ? ' — ' + X.supOrg : '')], ['عدد الطلاب', n], ['سُجّلت نتائجهم', d + ' من ' + n], ['اجتازوا', ok]].concat(X.final ? [['اعتماد النتائج', X.final.slice(0, 16)]] : []).forEach(p => { const b = el('div'); b.appendChild(el('small', '', p[0])); b.appendChild(el('b', '', p[1])); kv.appendChild(b); });
  $('bBar').style.width = (n ? Math.round(d * 100 / n) : 0) + '%';
  $('fin').classList.toggle('hidden', !(X.canEdit && n && d === n));
  if (X.back && !X.final){ msg('bMsg', 'أعاد ' + X.back.by + ' النتائج إليك للمراجعة: ' + X.back.reason + ' — عدّل ما يلزم ثم اضغط «اعتماد النتائج» مرة أخرى.', 'err'); $('fin').classList.toggle('hidden', !(X.canEdit && n && d === n)); } else
  msg('bMsg', X.final ? '✓ اعتمدتَ نتائج هذه المجموعة، وهي الآن مرجع للاطلاع فقط. التقرير جاهز للطباعة والتنزيل.' : d === n && n ? 'سُجّلت نتائج جميع الطلاب. راجعها ثم اضغط «اعتماد النتائج» لإنهاء المجموعة.' : '', X.final ? 'ok' : 'info');
  const fl = $('flt'); fl.innerHTML = '';
  [['all', 'الكل', n], ['wait', 'لم يُختبر', n - d], ['ok', 'اجتاز', ok], ['no', 'لم يجتز', d - ok]].forEach(f => { const b = el('button', F === f[0] ? 'on' : '', f[1] + ' (' + f[2] + ')'); b.onclick = () => { F = f[0]; render(); }; fl.appendChild(b); });
  const q = $('q').value.trim(), box = $('list'); box.innerHTML = '';
  const L = X.list.filter(s => (F === 'all' || (F === 'wait' ? !done(s) : s.status === X.st[F])) && (!q || (s.name + ' ' + s.nid).indexOf(q) !== -1));
  if (!L.length) box.appendChild(el('small', 'note', 'لا يوجد طلاب في هذا التصنيف.'));
  L.forEach(s => { const w = el('div', 'st'), nm = el('div', 'nm'); nm.appendChild(el('b', '', s.name)); nm.appendChild(el('small', '', 'الهوية: ' + (s.nid || '—') + ' • ' + s.hname)); w.appendChild(nm);
    w.appendChild(el('span', 'pill p-lv', s.level));
    if (done(s)) w.appendChild(el('span', 'pill ' + (s.status === X.st.ok ? 'p-ok' : 'p-no'), s.result + ' — ' + s.score));
    else w.appendChild(el('span', 'pill', 'لم يُختبر'));
    const b = el('button', done(s) ? '' : 'gold', !X.canEdit ? 'عرض' : done(s) ? 'تعديل النتيجة' : 'اختبار الطالب'); b.onclick = () => form(s); w.appendChild(b);
    box.appendChild(w); });
}
$('q').oninput = () => X && render();
function sOpt(){ const q = el('select'); const o0 = el('option', '', '— السورة —'); o0.value = ''; q.appendChild(o0); X.surah.forEach((nm, k) => { const o = el('option', '', (k + 1) + '. ' + nm); o.value = k + 1; q.appendChild(o); }); return q; }
const absAyah = (s, a) => { let n = 0; for (let i = 0; i < s - 1; i++) n += X.ayat[i]; return n + a; };
const absTo = n => { for (let k = 0; k < 114; k++){ if (n <= X.ayat[k]) return [k + 1, n]; n -= X.ayat[k]; } return [114, X.ayat[113]]; };
function stepIn(inp, min, max, step, ro){
