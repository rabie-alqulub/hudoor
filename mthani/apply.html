<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="mthani-64.png">
<link rel="apple-touch-icon" href="mthani-192.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلب التسجيل في الحلقات — منصة مثاني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#3B5F78; --navy3:#1F3546; --gold:#D08E2C; --gold2:#B87A1F; --light:#EAF0F4; --goldlight:#FBF1E1;
    --bg:#F5F3EE; --card:#FFFFFF; --text:#1E2A33; --muted:#66727C; --red:#B3261E; --line:#E2DDD3; --ok:#1B6B40; --okbg:#E3F2EA; --errbg:#FCE8E6; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0F161C; --card:#18222B; --text:#E9EEF2; --muted:#9DABB6; --light:#1F2D38; --goldlight:#2E2618; --line:#2A3743;
    --ok:#8FD9AE; --okbg:#183326; --errbg:#3A1F1D; --red:#F2B8B5; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
  .hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;padding:24px 16px 46px;text-align:center;border-bottom:4px solid var(--gold)}
  .hero .logo{width:84px;height:84px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--gold);overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .hero .logo img{width:72px;height:72px;object-fit:contain}
  .hero h1{margin:8px 0 0;font-size:22px} .hero h1 span{color:#F3D9AE}
  .hero p{margin:6px 0 0;font-size:14px;color:#F3D9AE}
  .notice{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--errbg);color:var(--red);font-size:14px;font-weight:700;line-height:1.8;border:1px solid rgba(179,38,30,.25)}
  .bw.choose{grid-template-columns:1fr}
  .seg{display:inline-flex;background:var(--light);border-radius:10px;padding:3px;margin-bottom:6px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:6px 16px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--navy);color:#fff}
  .hero .org{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:12px;opacity:.92}
  .hero .org img{width:26px;height:26px;border-radius:50%;background:#fff;padding:2px}
  main{max-width:560px;margin:-28px auto 0;padding:0 16px 40px}
  .card{background:var(--card);border-radius:18px;padding:18px 16px;box-shadow:0 6px 22px rgba(20,40,60,.08);border:1px solid var(--line);margin-bottom:12px}
  h2{margin:0 0 4px;color:var(--navy);font-size:19px} @media (prefers-color-scheme: dark){ h2{color:#E8B867} }
  small,.muted{color:var(--muted)}
  label{display:block;font-size:14px;margin:10px 0 4px;color:var(--muted)}
  input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .edgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px} .edgrid .full{grid-column:1/-1}
  .bw{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;align-items:end}
  .bw small{display:block;font-size:12px;margin-bottom:2px}
  .bw .hs{display:grid;grid-template-columns:.8fr 1.6fr 1fr;gap:4px} .bw .hs select{padding:10px 4px;font-size:14px}
  @media (max-width:430px){ .bw{grid-template-columns:1fr} }
  .btn{display:block;width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.6}
  .btn.light{background:var(--light);color:var(--text)}
  .msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.7}
  .msg.err{background:var(--errbg);color:var(--red)} .msg.info{background:var(--light)} .msg.ok{background:var(--okbg);color:var(--ok)}
  .done{text-align:center}
  .wait{font-size:56px;font-weight:700;color:var(--gold2);line-height:1.1;margin:8px 0}
  .hp{position:absolute;top:0;right:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="hero">
  <div class="logo"><img id="orgLogo" src="mthani-192.png" alt="شعار المجمع"></div>
  <h1>طلب التسجيل في الحلقات</h1>
  <p id="orgName">منصة مثاني</p>
</div>
<main>
  <div class="card" id="form">
    <h2>طلب تسجيل طالب</h2>
    <small>عبّئ بيانات الطالب، وستحصل على رقم انتظار، وستتواصل معكم إدارة المجمع بعد مراجعة الطلب. والحقول المطلوبة عليها علامة (*).</small>
    <div id="fields"></div>
    <div class="hp" aria-hidden="true"><label for="website">الموقع</label><input id="website" tabindex="-1" autocomplete="off"></div>
    <div class="notice">* التسجيل في الرابط لا يعني قبول ابنكم النهائي، وفي حال قبوله فستصلكم رسالة قبول.</div>
    <button class="btn" id="send">إرسال طلب التسجيل</button>
    <div id="m"></div>
  </div>
  <div class="card done hidden" id="done">
    <h2 id="doneT">تم استلام طلب التسجيل</h2>
    <div class="muted">رقم الانتظار</div>
    <div class="wait" id="waitNo"></div>
    <p id="doneP" style="line-height:1.8"></p>
    <button class="btn light" id="again">تسجيل طالب آخر</button>
  </div>
</main>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx1n59uCh_fri9XsUyxZlB7bXst4Ay-gZzKn8hIiQjunFotQQsEfE_8eQbhNmshHcI/exec';
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function msg(id, text, type){ const e = $(id); e.innerHTML = ''; if (text){ const d = el('div', 'msg ' + type, text); e.appendChild(d); } }
const fillSel = (id, opts, blank) => { const sel = $(id); sel.innerHTML = ''; if (blank !== undefined){ const o = el('option', '', blank); o.value = ''; sel.appendChild(o); } opts.forEach(x => { const o = el('option', '', x[1]); o.value = x[0]; sel.appendChild(o); }); };
/* ---------- أدوات مشتركة: المراحل، تاريخ الميلاد الهجري/الميلادي، نموذج الطالب ---------- */
const STAGES = ['أول ابتدائي', 'ثاني ابتدائي', 'ثالث ابتدائي', 'رابع ابتدائي', 'خامس ابتدائي', 'سادس ابتدائي', 'أول متوسط', 'ثاني متوسط',
  'ثالث متوسط', 'أول ثانوي', 'ثاني ثانوي', 'ثالث ثانوي', 'جامعي', 'موظف'];
const H_MONTHS = ['محرم', 'صفر', 'ربيع الأول', 'ربيع الآخر', 'جمادى الأولى', 'جمادى الآخرة', 'رجب', 'شعبان', 'رمضان', 'شوال', 'ذو القعدة', 'ذو الحجة'];
const normAr = t => String(t || '').trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ');
let HFMT = null;
function g2h(iso){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
  try { HFMT = HFMT || new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { timeZone:'UTC', year:'numeric', month:'numeric', day:'numeric' }); } catch(e){ return null; }
  const p = {}; HFMT.formatToParts(new Date(iso + 'T00:00:00Z')).forEach(x => p[x.type] = x.value);
  return [parseInt(p.year, 10), parseInt(p.month, 10), parseInt(p.day, 10)];
}
function h2g(y, m, d){
  const est = Date.UTC(622, 6, 16) + ((y - 1) * 354.36707 + (m - 1) * 29.530588 + (d - 1)) * 864e5;
  for (let k = -45; k <= 45; k++){
    const iso = new Date(est + k * 864e5).toISOString().slice(0, 10), h = g2h(iso);
    if (h && h[0] === y && h[1] === m && h[2] === d) return iso;
  }
  return '';
}
const pad2 = n => String(n).padStart(2, '0');
const hFmt = hv => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(hv || ''); return m ? (+m[3]) + ' ' + H_MONTHS[+m[2] - 1] + ' ' + m[1] + ' هـ' : ''; };
const bFmt = (g, h) => [g ? g.split('-').reverse().join('/') : '', hFmt(h)].filter(Boolean).join(' • ');
/** حقل تاريخ الميلاد: ميلادي وهجري، تعبئة أحدهما تملأ الآخر */
function birthWidget(boxId, choose){
  const box = $(boxId); box.innerHTML = '';
  const w = el('div', 'bw' + (choose ? ' choose' : '')), gd = el('div'), hd = el('div');
  gd.appendChild(el('small', '', 'ميلادي')); const g = el('input'); g.type = 'date'; g.max = new Date().toISOString().slice(0, 10); gd.appendChild(g);
  hd.appendChild(el('small', '', 'هجري')); const hs = el('div', 'hs');
  const sd = el('select'), sm = el('select'), sy = el('select');
  [[sd, 'اليوم'], [sm, 'الشهر'], [sy, 'السنة']].forEach(x => { const o = el('option', '', x[1]); o.value = ''; x[0].appendChild(o); });
  for (let i = 1; i <= 30; i++){ const o = el('option', '', i); o.value = i; sd.appendChild(o); }
  H_MONTHS.forEach((n, i) => { const o = el('option', '', (i + 1) + ' ' + n); o.value = i + 1; sm.appendChild(o); });
  const cy = (g2h(new Date().toISOString().slice(0, 10)) || [1448])[0];
  for (let y = cy; y >= 1370; y--){ const o = el('option', '', y); o.value = y; sy.appendChild(o); }
  hs.appendChild(sd); hs.appendChild(sm); hs.appendChild(sy); hd.appendChild(hs);
  let mode = 'h';
  if (choose){
    const seg = el('div', 'seg'), bh = el('button', 'on', 'هجري'), bg = el('button', '', 'ميلادي');
    bh.type = bg.type = 'button';
    const pick = m => { mode = m; bh.classList.toggle('on', m === 'h'); bg.classList.toggle('on', m === 'g'); hd.classList.toggle('hidden', m !== 'h'); gd.classList.toggle('hidden', m !== 'g'); };
    bh.onclick = () => pick('h'); bg.onclick = () => pick('g');
    seg.appendChild(bh); seg.appendChild(bg); box.appendChild(seg); pick('h');
    gd.firstChild.remove(); hd.firstChild.remove();
  }
  w.appendChild(gd); w.appendChild(hd); box.appendChild(w);
  const setH = h => { sd.value = h ? h[2] : ''; sm.value = h ? h[1] : ''; sy.value = h ? h[0] : ''; };
  g.onchange = () => setH(g2h(g.value));
  const fromH = () => { if (sd.value && sm.value && sy.value){ const iso = h2g(+sy.value, +sm.value, +sd.value); if (iso) g.value = iso; } };
  [sd, sm, sy].forEach(x => x.onchange = fromH);
  return {
    get(){
      const h = sd.value && sm.value && sy.value ? sy.value + '-' + pad2(sm.value) + '-' + pad2(sd.value) : '';
      if (choose){   // يُرسل ما اختاره، ويُحسب الآخر تلقائياً
        if (mode === 'h') return { g: h ? h2g(+sy.value, +sm.value, +sd.value) : '', h: h };
        const x = g2h(g.value); return { g: g.value, h: x ? x[0] + '-' + pad2(x[1]) + '-' + pad2(x[2]) : '' };
      }
      return { g: g.value, h: h };
    },
    set(gv, hv){ g.value = /^\d{4}-\d{2}-\d{2}$/.test(gv || '') ? gv : ''; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(hv || ''); setH(m ? [+m[1], +m[2], +m[3]] : g2h(g.value)); }
  };
}
/** حقول بيانات الطالب المشتركة (التسجيل من الإدارة) */
function studentFields(boxId, pre){
  const box = $(boxId); box.innerHTML = '';
  box.insertAdjacentHTML('beforeend', '<div class="edgrid" style="margin-top:6px">' +
    '<div><label for="' + pre + 'N1">الاسم الأول *</label><input id="' + pre + 'N1" autocomplete="off"></div>' +
    '<div><label for="' + pre + 'N2">اسم الأب *</label><input id="' + pre + 'N2" autocomplete="off"></div>' +
    '<div><label for="' + pre + 'N3">اسم الجد *</label><input id="' + pre + 'N3" autocomplete="off"></div>' +
    '<div><label for="' + pre + 'N4">اسم العائلة *</label><input id="' + pre + 'N4" autocomplete="off"></div>' +
    '<div class="full"><label for="' + pre + 'Nid">رقم الهوية / الإقامة *</label><input id="' + pre + 'Nid" inputmode="numeric" maxlength="14" autocomplete="off"></div>' +
    '<div class="full"><label>تاريخ الميلاد هجري أو ميلادي *</label><div id="' + pre + 'Birth"></div></div>' +
    '<div><label for="' + pre + 'Pp">جوال ولي الأمر *</label><input id="' + pre + 'Pp" inputmode="tel" maxlength="10" placeholder="05xxxxxxxx"></div>' +
    '<div><label for="' + pre + 'Sp">جوال الطالب</label><input id="' + pre + 'Sp" inputmode="tel" maxlength="10" placeholder="05xxxxxxxx"></div>' +
    '<div class="full"><label for="' + pre + 'Stage">المرحلة الدراسية *</label><select id="' + pre + 'Stage"></select></div></div>');
  fillSel(pre + 'Stage', STAGES.map(v => [v, v]), '— اختر —');
  const bw = birthWidget(pre + 'Birth', true);
  return {
    get(){ const b = bw.get(); return { n1:$(pre + 'N1').value.trim(), n2:$(pre + 'N2').value.trim(), n3:$(pre + 'N3').value.trim(), n4:$(pre + 'N4').value.trim(),
      nid:$(pre + 'Nid').value.replace(/\D/g, ''), birth:b.g, birthH:b.h, pphone:$(pre + 'Pp').value.replace(/\D/g, ''), sphone:$(pre + 'Sp').value.replace(/\D/g, ''), stage:$(pre + 'Stage').value }; },
    reset(){ ['N1','N2','N3','N4','Nid','Pp','Sp'].forEach(k => $(pre + k).value = ''); $(pre + 'Stage').value = ''; bw.set('', ''); },
    check(d){
      const miss = [['n1','الاسم الأول'],['n2','اسم الأب'],['n3','اسم الجد'],['n4','اسم العائلة']].filter(x => !d[x[0]]).map(x => x[1]);
      if (miss.length) return 'أكمل: ' + miss.join('، ');
      if (d.nid.length < 10) return 'رقم الهوية / الإقامة 10 أرقام.';
      if (!d.birth && !d.birthH) return 'أدخل تاريخ الميلاد (هجري أو ميلادي).';
      if (!/^05\d{8}$/.test(d.pphone)) return 'جوال ولي الأمر يبدأ بـ 05 ويتكون من 10 أرقام.';
      if (d.sphone && !/^05\d{8}$/.test(d.sphone)) return 'جوال الطالب يبدأ بـ 05 ويتكون من 10 أرقام.';
      if (!d.stage) return 'اختر المرحلة الدراسية.';
      return '';
    }
  };
}

const F = studentFields('fields', 'a');

/* هوية المجمع من إعدادات المشترك (لا اسم ثابت): الاسم والشعار */
(async () => { let B = {}; try { B = JSON.parse(localStorage.getItem('hq_brand') || '{}') || {}; } catch(e){}
  const put = b => { const i = document.getElementById('orgLogo'), n = document.getElementById('orgName'); if (i) i.src = b.logo || 'mthani-192.png'; if (n && (b.org || b.orgShort)) n.textContent = b.org || b.orgShort; if (b.orgShort || b.org) document.title = 'طلب التسجيل في الحلقات — ' + (b.orgShort || b.org); };
  put(B); try { const r = await (await fetch(API_URL, { method:'POST', body:JSON.stringify({ action:'brand' }) })).json(); if (r && r.ok){ B = { org:r.org, orgShort:r.orgShort, logo:r.logo }; try { localStorage.setItem('hq_brand', JSON.stringify(B)); } catch(e){} put(B); } } catch(e){} })();
async function post(data){ const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(data) }); return r.json(); }
$('send').onclick = async () => {
  const d = F.get(), e = F.check(d);
  if (e) return msg('m', e, 'err');
  $('send').disabled = true; msg('m', 'جاري الإرسال...', 'info');
  try {
    const r = await post({ action:'apply', data:d, hp:$('website').value });
    if (!r.ok) return msg('m', r.msg === 'إجراء غير معروف' ? 'التسجيل غير متاح حالياً، حاول لاحقاً.' : r.msg, 'err');
    $('waitNo').textContent = r.wait;
    $('doneT').textContent = r.dup ? 'لديك طلب سابق قيد المراجعة' : 'تم استلام طلب التسجيل';
    $('doneP').textContent = r.dup ? 'هذا رقم الانتظار الخاص بطلبكم السابق لنفس رقم الهوية، ولا حاجة لتسجيله مرة أخرى.'
      : 'احتفظ برقم الانتظار، وستتواصل معكم إدارة المجمع على جوال ولي الأمر بعد مراجعة الطلب. التسجيل لا يعني القبول النهائي، وفي حال قبوله فستصلكم رسالة قبول.';
    $('form').classList.add('hidden'); $('done').classList.remove('hidden'); F.reset(); msg('m', '', ''); window.scrollTo(0, 0);
  } catch(err){ msg('m', 'تعذّر الاتصال، تأكد من الإنترنت وحاول مرة أخرى.', 'err'); }
  finally { $('send').disabled = false; }
};
$('again').onclick = () => { $('done').classList.add('hidden'); $('form').classList.remove('hidden'); };
</script>
</body>
</html>
